<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ngu Thế Thế Cũng Bấm Vào Ngu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(135deg,#ff0055,#ffaa00,#ff0055);background-size:400% 400%;animation:bg 8s ease infinite;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,3px) rotate(-1deg)}75%{transform:translate(3px,-3px) rotate(1deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fly{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-120vh) rotate(720deg)}}
.card{background:rgba(0,0,0,.92);border:4px solid #ffea00;border-radius:20px;padding:40px 30px;max-width:520px;width:100%;text-align:center;box-shadow:0 0 60px #ffea00,0 0 100px rgba(255,0,85,.6);animation:shake 0.5s infinite;position:relative;z-index:10}
h1{font-size:clamp(22px,6vw,40px);font-weight:900;line-height:1.15;background:linear-gradient(90deg,#ffea00,#ff0055,#ffea00);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;text-shadow:0 0 20px rgba(255,234,0,.4)}
.emoji{font-size:clamp(60px,18vw,100px);display:block;margin:10px 0;animation:pulse .8s infinite}
.sub{color:#ffea00;font-size:clamp(13px,3.5vw,16px);font-weight:bold;margin-bottom:20px;line-height:1.5}
.btn{background:linear-gradient(135deg,#ffea00,#ff8800);border:none;border-radius:14px;padding:16px 34px;color:#000;font-weight:900;font-size:clamp(14px,4vw,18px);cursor:pointer;font-family:inherit;box-shadow:0 6px 0 #aa5500,0 0 30px rgba(255,234,0,.7);transition:.15s;text-transform:uppercase;letter-spacing:1px}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 #aa5500}
.btn.run{position:fixed;z-index:9999;transition:.3s}
.counter{position:fixed;top:15px;left:15px;background:rgba(0,0,0,.85);color:#ffea00;font-family:monospace;font-size:16px;font-weight:bold;padding:10px 16px;border:2px solid #ffea00;border-radius:10px;z-index:100;box-shadow:0 0 20px rgba(255,234,0,.5)}
.msg{position:fixed;background:rgba(0,0,0,.9);color:#ffea00;padding:12px 20px;border:2px solid #ffea00;border-radius:10px;font-weight:bold;font-size:14px;z-index:99999;pointer-events:none;font-family:monospace;animation:fly 2.5s linear forwards;box-shadow:0 0 20px rgba(255,234,0,.7)}
.win{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:999999;text-align:center;padding:20px}
.win h2{font-size:clamp(28px,8vw,52px);color:#ffea00;text-shadow:0 0 30px #ffea00;margin-bottom:20px;animation:pulse 1s infinite}
.win p{color:#fff;font-size:16px;margin-bottom:10px;font-family:monospace}
.win .score{color:#ff0055;font-size:24px;font-weight:bold;margin-bottom:30px}
</style>
</head>
<body>
<div class="counter">Lần bấm: <span id="count">0</span></div>
<div class="card">
<h1>Ngu Thế Thế Cũng Bấm Vào Ngu</h1>
<span class="emoji">🤡</span>
<div class="sub">Bảo đừng bấm mà vẫn bấm<br>Đúng là ngu thật rồi 😂</div>
<button class="btn" id="mainBtn">ĐỪNG BẤM VÀO</button>
</div>
<div class="win" id="win">
<h2>🎉 CHÚC MỪNG! 🎉</h2>
<p>Bạn đã bấm <span class="score" id="finalCount">0</span> lần</p>
<p id="rank">Xếp hạng: ...</p>
<p style="margin-top:20px;font-size:12px;color:#888;">Bấm nút bên dưới để chơi lại</p>
<button class="btn" onclick="location.reload()" style="margin-top:20px;">CHƠI LẠI</button>
</div>

<script>
var count=0;
var btn=document.getElementById('mainBtn');
var messages=[
  'Ngu vãi 😂',
  'Bảo đừng bấm mà',
  'Trời ơi ngu thế',
  'Bấm nữa đi bạn',
  'IQ 200 đây rồi',
  'Ngu thật rồi 😭',
  'Bấm nữa là tau chết',
  'Bạn có vấn đề à?',
  'Má ơi nó bấm nữa',
  'Không nghe lời hả',
  'Ngu hết phần thiên hạ',
  'Ba mẹ biết chưa?',
  'Cười ẻ =))',
  'Nút nó đẹp à?',
  'Tay nhanh hơn não',
  'Ngu nhưng mà vui',
  'Sao cứ bấm hoài vậy',
  'Tội nghiệp nút ghê'
];
var ranks=[
  [5,'🐣 Gà mới nở'],
  [15,'🤡 Thằng hề chính hiệu'],
  [30,'💀 Ngu có bằng cấp'],
  [50,'👽 Ngu ngoài hành tinh'],
  [100,'🔥 Ngu thần thánh'],
  [Infinity,'🌌 Ngu vô cực']
];

function flyMessage(text){
  var m=document.createElement('div');
  m.className='msg';
  m.textContent=text;
  m.style.left=(10+Math.random()*70)+'vw';
  m.style.top=(60+Math.random()*20)+'vh';
  document.body.appendChild(m);
  setTimeout(function(){m.remove()},2500);
}

function moveButton(){
  var pad=20;
  var w=btn.offsetWidth;
  var h=btn.offsetHeight;
  var x=pad+Math.random()*(innerWidth-w-pad*2);
  var y=pad+Math.random()*(innerHeight-h-pad*2);
  btn.style.left=x+'px';
  btn.style.top=y+'px';
  btn.style.position='fixed';
}

btn.addEventListener('click',function(e){
  count++;
  document.getElementById('count').textContent=count;
  flyMessage(messages[Math.floor(Math.random()*messages.length)]);
  
  try{
    var aC=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());
    var o=aC.createOscillator();
    var g=aC.createGain();
    o.connect(g);g.connect(aC.destination);
    o.type='square';
    o.frequency.value=200+Math.random()*800;
    g.gain.setValueAtTime(0.05,aC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,aC.currentTime+0.1);
    o.start();o.stop(aC.currentTime+0.1);
  }catch(err){}
  
  if(count>=5){
    moveButton();
  }
  
  if(count>=3&&count<10){
    var card=document.querySelector('.card');
    card.style.animationDuration=(0.5-(count*0.03))+'s';
  }
  
  if(count%10===0){
    var colors=['#ff0055','#00ff88','#00aaff','#ffea00','#ff00ff','#ff8800'];
    document.body.style.background='linear-gradient(135deg,'+colors[Math.floor(Math.random()*colors.length)]+','+colors[Math.floor(Math.random()*colors.length)]+')';
  }
  
  if(count>=100){
    showWin();
  }
});

function showWin(){
  document.getElementById('finalCount').textContent=count;
  var rank='🐣 Gà mới nở';
  for(var i=0;i<ranks.length;i++){
    if(count<ranks[i][0]){rank=ranks[i][1];break}
  }
  document.getElementById('rank').textContent='Xếp hạng: '+rank;
  document.getElementById('win').style.display='flex';
}

document.addEventListener('keydown',function(e){
  if(e.code==='Space'){
    e.preventDefault();
    btn.click();
  }
});

document.addEventListener('touchstart',function(e){
  if(e.target!==btn&&!e.target.closest('.btn')&&!e.target.closest('.win')){
    if(count>0&&count<100){
      count++;
      document.getElementById('count').textContent=count;
      flyMessage('Bấm cả màn hình luôn 😂');
    }
  }
},{passive:true});
</script>
</body>
</html>
